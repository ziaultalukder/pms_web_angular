<div class="card">
    <div class="card-header">
        <div class="row">
            <div class="col-md-8">
                <button class="btn btn-primary btn-sm" (click)="AddSupplier()">Add Item</button>
            </div>
            <div class="col-md-4">
                <input type="text" class="form-control" placeholder="search item" (input)="onInput($event)">
            </div>
        </div>

    </div>
    <div class="card-body">
        <table>
            <thead>
                <tr>
                    <th scope="col">SL</th>
                    <th scope="col">Supplier Name</th>
                    <th scope="col">Action</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let med of supplierList; let i = index">
                    <td data-label="SL">{{i+1}}</td>
                    <td data-label="Manufacturer Name">{{med.name}}</td>
                    <td data-label="Action">
                        <button class="btn btn-primary btn-sm" (click)="updateSupplier(med.id)">Update</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
