<div class="register-form">
    <form [formGroup]="changePasswordForm" (ngSubmit)="onSubmit()">

        <div class="form-group">
            <label>Old Password</label>
            <input type="password" formControlName="oldPassword" class="form-control"
                [ngClass]="{ 'is-invalid': submitted && f['password'].errors }" />
            <div *ngIf="submitted && f['password'].errors" class="invalid-feedback">
                <div *ngIf="f['password'].errors['required']">Password is required</div>
                <div *ngIf="f['password'].errors['maxlength']">
                    Username must not exceed 40 characters
                </div>
            </div>
        </div>

        <div class="form-group">
            <label>New Password</label>
            <input type="password" formControlName="password" class="form-control"
                [ngClass]="{ 'is-invalid': submitted && f['password'].errors }" />
            <div *ngIf="submitted && f['password'].errors" class="invalid-feedback">
                <div *ngIf="f['password'].errors['required']">New Password is required</div>
                <div *ngIf="f['password'].errors['minlength']">
                    Password must be at least 6 characters
                </div>
                <div *ngIf="f['password'].errors['maxlength']">
                    Username must not exceed 40 characters
                </div>
            </div>
        </div>

        <div class="form-group">
            <label>Confirm Password</label>
            <input type="password" formControlName="txConfirmationPassword" class="form-control"
                [ngClass]="{ 'is-invalid': submitted && f['txConfirmationPassword'].errors }" />
            <div *ngIf="submitted && f['txConfirmationPassword'].errors" class="invalid-feedback">
                <div *ngIf="f['txConfirmationPassword'].errors['required']">
                    Confirm Password is required
                </div>
                <div *ngIf="f['txConfirmationPassword'].errors['matching']">
                    Confirm Password does not match
                </div>
            </div>
        </div>

        <div class="form-group">
            <button type="submit" class="btn btn-primary">Update</button>
        </div>

    </form>
</div>
